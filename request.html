<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Request Delivery | PartsPilot</title>

  <style>
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .form-card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1,
    h2 {
      color: #0b4ea2;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 100px;
    }

    button,
    .button-link {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #0b4ea2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    .secondary-button {
      background: #e7eef8;
      color: #0b4ea2;
    }

    .home-link {
      display: block;
      margin-bottom: 20px;
      color: #0b4ea2;
      font-weight: bold;
      text-decoration: none;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    #confirmation-screen {
      display: none;
      text-align: center;
    }

    .po-box {
      margin: 20px 0;
      padding: 16px;
      background: #f4f7fb;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="form-card">

    <a class="home-link" href="index.html">Home</a>

    <div id="form-screen">

      <h1>Request Delivery</h1>

      <form id="delivery-form">

        <label>Company Name</label>
        <input type="text" name="company_name" required>

        <label>Vendor / Supply House</label>
        <input type="text" name="vendor_supply_house" required>

        <label>Pickup Address</label>
        <input type="text" name="pickup_address" required>

        <label>Delivery Address</label>
        <input type="text" name="delivery_address" required>

        <label>Purchase Order Number</label>
        <input type="text" name="purchase_order" required>

        <label>Contact Name</label>
        <input type="text" name="contact_name" required>

        <label>Contact Phone Number</label>
        <input type="tel" name="contact_phone" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Part Description</label>
        <textarea name="part_description" required></textarea>

        <label>Special Instructions</label>
        <textarea name="notes"></textarea>

        <label>Delivery Needed</label>
        <select name="delivery_needed" required>
          <option value="">Select When Needed</option>
          <option value="Now">Now</option>
          <option value="By End of Day">By End of Day</option>
          <option value="Next Business Day">Next Business Day</option>
        </select>

        <button type="submit">Submit Request</button>

        <div id="status"></div>

      </form>

    </div>

    <div id="confirmation-screen">

      <h2>Thank you! Your order has been received.</h2>

      <div class="po-box">
        Purchase Order:
        <strong id="confirmation-po"></strong>
      </div>

      <a class="button-link" href="tel:8063823855">
        Call 806-382-3855
      </a>

      <button class="secondary-button" id="submit-another" type="button">
        Submit Another Request
      </button>

      <a class="button-link secondary-button" href="index.html">
        Home
      </a>

    </div>

  </div>

  <script>
    const form = document.getElementById("delivery-form");
    const statusMessage = document.getElementById("status");
    const formScreen = document.getElementById("form-screen");
    const confirmationScreen = document.getElementById("confirmation-screen");
    const confirmationPO = document.getElementById("confirmation-po");
    const submitAnotherButton = document.getElementById("submit-another");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      statusMessage.textContent = "Submitting...";

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch("https://formspree.io/f/xnjekqzl", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          confirmationPO.textContent = data.purchase_order;

          form.reset();
          statusMessage.textContent = "";

          formScreen.style.display = "none";
          confirmationScreen.style.display = "block";

          window.scrollTo(0, 0);
        } else {
          statusMessage.textContent =
            "Submission failed. Please try again.";
        }
      } catch (error) {
        statusMessage.textContent =
          "Submission failed. Please check your connection.";
      }
    });

    submitAnotherButton.addEventListener("click", function() {
      confirmationScreen.style.display = "none";
      formScreen.style.display = "block";
      window.scrollTo(0, 0);
    });
  </script>

</body>
</html>
