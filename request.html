<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Request Delivery | PartsPilot</title>

  <style>
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .form-card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      color: #0b4ea2;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      background: #0b4ea2;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #0b4ea2;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="form-card">

    <h1>Request Delivery</h1>

    <form action="https://formspree.io/f/xnjekqzl" method="POST">

      <input type="hidden" name="_subject" value="New PartsPilot Delivery Request">

      <label for="company_name">Company Name</label>
      <input
        id="company_name"
        type="text"
        name="company_name"
        required
      >

      <label for="pickup_address">Pickup Address</label>
      <input
        id="pickup_address"
        type="text"
        name="pickup_address"
        required
      >

      <label for="dropoff_address">Drop-off Address</label>
      <input
        id="dropoff_address"
        type="text"
        name="dropoff_address"
        required
      >

      <label for="purchase_order">Purchase Order Number</label>
      <input
        id="purchase_order"
        type="text"
        name="purchase_order"
        required
      >

      <label for="contact_name">Contact Name</label>
      <input
        id="contact_name"
        type="text"
        name="contact_name"
        required
      >

      <label for="contact_phone">Contact Phone Number</label>
      <input
        id="contact_phone"
        type="tel"
        name="contact_phone"
        required
      >

      <label for="part_description">Part Description</label>
      <textarea
        id="part_description"
        name="part_description"
        required
      ></textarea>

      <label for="notes">Special Instructions</label>
      <textarea
        id="notes"
        name="notes"
      ></textarea>

      <button type="submit">Submit Request</button>

    </form>

    <a class="back-link" href="index.html">Back to Home</a>

  </div>

</body>
</html>
