<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Request Delivery | PartsPilot</title>

  <style>
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .form-card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      color: #0b4ea2;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 100px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      background: #0b4ea2;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #0b4ea2;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="form-card">

    <h1>Request Delivery</h1>

    <form id="delivery-form">

      <label>Company Name</label>
      <input type="text" name="company_name" required>

      <label>Pickup Address</label>
      <input type="text" name="pickup_address" required>

      <label>Drop-off Address</label>
      <input type="text" name="dropoff_address" required>

      <label>Purchase Order Number</label>
      <input type="text" name="purchase_order" required>

      <label>Contact Name</label>
      <input type="text" name="contact_name" required>

      <label>Contact Phone Number</label>
      <input type="tel" name="contact_phone" required>

      <label>Part Description</label>
      <textarea name="part_description" required></textarea>

      <label>Special Instructions</label>
      <textarea name="notes"></textarea>

      <label>Delivery Priority</label>
      <select name="priority" required>
        <option value="">Select Priority</option>
        <option value="Standard">Standard</option>
        <option value="Rush">Rush</option>
      </select>

      <button type="submit">Submit Request</button>

      <div id="status"></div>

    </form>

    <a class="back-link" href="index.html">Back to Home</a>

  </div>

  <script>
    const form = document.getElementById("delivery-form");
    const statusMessage = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      statusMessage.textContent = "Submitting...";

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch("https://formspree.io/f/xnjekqzl", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          statusMessage.textContent = "Delivery request submitted successfully.";
          form.reset();
        } else {
          statusMessage.textContent = "Submission failed. Please try again.";
        }
      } catch (error) {
        statusMessage.textContent = "Submission failed. Please check your connection.";
      }
    });
  </script>

</body>
</html>
